<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Portal Gamer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments :: menu}"></div>

<main class="form-container">
    <section class="form-card profile-card">

        <h1>Mi perfil gamer</h1>
        <p>Personaliza tu información y tus preferencias.</p>

        <div class="alert success"
             th:if="${mensaje}"
             th:text="${mensaje}"></div>

        <div class="alert error"
             th:if="${error}"
             th:text="${error}"></div>

        <div class="avatar-preview">
            <img th:if="${usuario != null and usuario.avatarUrl != null and !#strings.isEmpty(usuario.avatarUrl)}"
                 th:src="${usuario.avatarUrl}"
                 alt="Avatar del usuario">

            <div class="avatar-placeholder"
                 th:if="${usuario == null or usuario.avatarUrl == null or #strings.isEmpty(usuario.avatarUrl)}">
                🎮
            </div>
        </div>

        <form th:action="@{/perfil}" method="post">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre"
                   th:value="${usuario?.nombre}" disabled>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email"
                   th:value="${usuario?.email}" disabled>

            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username"
                   th:value="${usuario?.username}"
                   minlength="3" maxlength="40" required>

            <label for="juegosInteres">Juegos de interés</label>
            <textarea id="juegosInteres" name="juegosInteres"
                      rows="3" maxlength="1000"
                      placeholder="Ej. Minecraft, Valorant, Fortnite..."
                      th:text="${usuario?.juegosInteres}"></textarea>

            <label for="avatarUrl">URL de tu avatar</label>
            <input type="url" id="avatarUrl" name="avatarUrl"
                   maxlength="1000"
                   placeholder="https://ejemplo.com/avatar.png"
                   th:value="${usuario?.avatarUrl}">

            <label class="checkbox-row">
                <input type="checkbox" name="notificaciones"
                       value="true"
                       th:checked="${usuario?.notificaciones}">
                Quiero recibir notificaciones sobre eventos.
            </label>

            <button class="button full-width" type="submit">
                Guardar cambios
            </button>
        </form>

        <a class="back-link" th:href="@{/eventos}">
            Explorar eventos
        </a>

    </section>
</main>

<div th:replace="~{fragments :: pie}"></div>

</body>
</html>
