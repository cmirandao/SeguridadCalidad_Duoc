<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Portal Gamer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments :: menu}"></div>

<main class="form-container">
    <section class="form-card">
        <h1>Únete a la comunidad</h1>
        <p>Crea tu cuenta y descubre nuevos eventos.</p>

        <div class="alert error"
             th:if="${error}"
             th:text="${error}"></div>

        <form th:action="@{/registro}" method="post">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre"
                   maxlength="100" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email"
                   maxlength="150" required>

            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username"
                   minlength="3" maxlength="40" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>

            <small>
                Usa al menos 8 caracteres, una mayúscula,
                una minúscula y un número.
            </small>

            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword" minlength="8" required>

            <button class="button full-width" type="submit">
                Crear cuenta
            </button>
        </form>

        <p class="form-footer">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </section>
</main>

<div th:replace="~{fragments :: pie}"></div>

</body>
</html>
