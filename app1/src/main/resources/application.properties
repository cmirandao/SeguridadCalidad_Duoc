spring.application.name=app1
server.port=8081

# --- CONFIGURACIÓN DE MYSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portal_gamer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- THYMELEAF ---
spring.thymeleaf.cache=false

# --- CONFIGURACIÓN JWT ---
# Clave secreta en Base64 (requerida por jjwt para firmas HMAC-SHA256)
jwt.secret=ZmlybWFfc2VjcmV0YV9wYXJhX2VsX3BvcnRhbF9nYW1lcl9kdW9jX3VjXzIwMjY=
# Tiempo de expiración del token en milisegundos (86400000 = 1 día)
jwt.expiration=86400000