spring.application.name=app1
server.port=8080

# --- CONFIGURACIÓN DE MYSQL ---
spring.datasource.url=jdbc:mysql://mysql-portalgamer:3306/portal_gamer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- THYMELEAF ---
spring.thymeleaf.cache=false

# --- CONFIGURACIÓN JWT (SEMANA 2) ---
# Clave secreta en Base64 (requerida por jjwt para firmas HMAC-SHA256)
jwt.secret=ZmlybWFfc2VjcmV0YV9wYXJhX2VsX3BvcnRhbF9nYW1lcl9kdW9jX3VjXzIwMjY=
# Tiempo de expiración del token en milisegundos (86400000 = 1 día)
jwt.expiration=86400000